<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorldMill — Rust + WebGPU Infinite 3D World</title>
  </head>
  <body>
    <canvas id="gpu-canvas"></canvas>

    <aside class="hud">
      <div class="hud-header">
        <div class="brand">
          <span class="dot" id="conn-dot"></span>
          <h1>WorldMill</h1>
        </div>
        <span class="badge" id="fps-badge">-- FPS</span>
      </div>

      <div class="gpu-line" id="gpu-adapter">Connecting to Rust wgpu backend...</div>

      <div class="metrics">
        <div class="metric">
          <span class="label">Chunks</span>
          <strong id="m-chunks">0</strong>
        </div>
        <div class="metric">
          <span class="label">Triangles</span>
          <strong id="m-tris">0</strong>
        </div>
        <div class="metric">
          <span class="label">GPU Bake</span>
          <strong id="m-bake">-- ms</strong>
        </div>
        <div class="metric">
          <span class="label">Cache Hits</span>
          <strong id="m-hits">0</strong>
        </div>
      </div>

      <div class="controls">
        <div class="row">
          <label for="seed-input">World Seed</label>
          <input id="seed-input" type="number" value="42" min="1" max="999999" />
          <button id="btn-seed">Load</button>
        </div>

        <div class="sun-control">
          <div class="sun-header">
            <label for="sun-slider">Time of Day</label>
            <span id="sun-label">Afternoon 46°</span>
          </div>
          <input id="sun-slider" type="range" min="4" max="82" step="1" value="46" />
        </div>

        <div class="presets">
          <button type="button" class="preset-btn active" data-preset="alpine">Alpine Vista</button>
          <button type="button" class="preset-btn" data-preset="arches">Sky Arches</button>
          <button type="button" class="preset-btn" data-preset="caves">Crystal Caves</button>
        </div>

        <div class="row">
          <button id="btn-batch" class="primary">Batch Bake Region (GPU)</button>
          <button id="btn-lod-tint">LOD Tint</button>
        </div>
        <div class="batch-status" id="batch-status"></div>
      </div>

      <div class="pos-line" id="pos-line">Pos: 0, 0, 0</div>
      <div class="help">
        <strong>Drag</strong> or <strong>Click</strong> to look · <strong>WASD</strong> fly ·
        <strong>Space/Shift</strong> up/down · <strong>F</strong> fast boost
      </div>
    </aside>

    <aside class="minimap-panel" aria-label="Spatial streaming minimap">
      <div class="minimap-header">
        <span>Streaming Map</span>
        <span class="minimap-scale">±230m</span>
      </div>
      <canvas id="minimap-canvas" width="160" height="160"></canvas>
      <div class="minimap-legend">
        <span><i class="swatch lod0"></i>LOD0</span>
        <span><i class="swatch lod1"></i>LOD1</span>
        <span><i class="swatch bake"></i>Bake</span>
      </div>
    </aside>

    <div id="webgpu-error" class="error-overlay hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
